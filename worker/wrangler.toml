name = "accounting-tool"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "../public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "accounting_tool"
# Replace with the UUID printed by `wrangler d1 create accounting_tool`
# (see DEPLOY.md). This placeholder is only used for local `wrangler dev`.
database_id = "00000000-0000-0000-0000-000000000000"
